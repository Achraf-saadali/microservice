services:
  mongodb:
    image: mongo:7.0
    container_name: microservices-mongodb
    profiles: [db]
    ports: ["27017:27017"]
    volumes: [mongodb_data:/data/db]
  mysql:
    image: mysql:8.4
    container_name: microservices-mysql
    profiles: [db]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: microservices
      MYSQL_PASSWORD: microservices
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: microservices-zookeeper
    profiles: [kafka]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: microservices-kafka
    profiles: [kafka]
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: microservices-kafka-ui
    profiles: [kafka]
    depends_on: [kafka]
    ports: ["8086:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: microservices-mailpit
    profiles: [kafka]
    ports: ["1025:1025", "8025:8025"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: microservices-keycloak
    profiles: [security]
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8181:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: microservices-prometheus
    profiles: [monitoring]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9090:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:11.3.0
    container_name: microservices-grafana
    profiles: [monitoring]
    depends_on: [prometheus]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
volumes:
  mongodb_data:
  mysql_data:
  grafana_data:
