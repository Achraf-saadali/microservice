global:
  scrape_interval: 10s
scrape_configs:
  - job_name: service-produit
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['host.docker.internal:8083']}]
  - job_name: service-commande
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['host.docker.internal:8081']}]
  - job_name: service-catalogue
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['host.docker.internal:8082']}]
  - job_name: service-notification
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['host.docker.internal:8085']}]
  - job_name: service-gateway
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['host.docker.internal:8888']}]
