spring.application.name=service-catalogue
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${CATALOGUE_DB_URL:jdbc:mysql://localhost:3306/catalogueDB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8082}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.instance-id=${spring.application.name}:${random.value}
catalogue.simulation.delay-ms=${CATALOGUE_DELAY_MS:0}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
