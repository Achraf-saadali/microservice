spring.application.name=service-commande
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${COMMANDE_DB_URL:jdbc:mysql://localhost:3306/service-commande?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8081}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.instance-id=${spring.application.name}:${random.value}
catalogue.timeout-seconds=${CATALOGUE_TIMEOUT_SECONDS:2}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
resilience4j.circuitbreaker.instances.catalogue.register-health-indicator=true
resilience4j.circuitbreaker.instances.catalogue.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.catalogue.sliding-window-size=10
resilience4j.circuitbreaker.instances.catalogue.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogue.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.catalogue.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.catalogue.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.catalogue.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.catalogue.record-exceptions=ENSAJ.service_commande.exception.CatalogueIndisponibleException
resilience4j.retry.instances.catalogue.max-attempts=3
resilience4j.retry.instances.catalogue.wait-duration=200ms
