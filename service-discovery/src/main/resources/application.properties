spring.application.name=service-discovery
eureka.instance.hostname=localhost
# Le serveur ne s'enregistre pas lui-même et ne récupère pas de registre
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false
server.port=8761

# Dev uniquement : retire rapidement les instances arrêtées et supprime
# l'alerte rouge "EMERGENCY! EUREKA MAY BE INCORRECTLY CLAIMING INSTANCES ARE UP"
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
