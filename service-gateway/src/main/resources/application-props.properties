# Routes configurées par propriétés (partie 1 du TP)
# Activer avec : mvn spring-boot:run -Dspring-boot.run.profiles=props

spring.cloud.gateway.routes[0].id=service-commande
spring.cloud.gateway.routes[0].uri=lb://service-commande
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/commande/**

spring.cloud.gateway.routes[1].id=service-catalogue
spring.cloud.gateway.routes[1].uri=lb://service-catalogue
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/catalogue/**

spring.cloud.gateway.routes[2].id=service-discovery
spring.cloud.gateway.routes[2].uri=http://localhost:8761
spring.cloud.gateway.routes[2].predicates[0]=Path=/,/eureka/**

# Circuit Breaker sur les routes métier (filtre CircuitBreaker)
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=serviceCommandeCircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallbackRoute

spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=serviceCatalogueCircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallbackRoute

# Route vers le service produit + Circuit Breaker
spring.cloud.gateway.routes[3].id=service-produit
spring.cloud.gateway.routes[3].uri=lb://service-produit
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/produit/**
spring.cloud.gateway.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.name=serviceProduitCircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.fallbackUri=forward:/fallbackRoute
